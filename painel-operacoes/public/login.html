<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Painel Operações Digital</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --acc:#38bdf8; --err:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--txt); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { background:var(--card); padding:32px; border-radius:14px; width:min(360px,92vw);
         box-shadow:0 10px 40px rgba(0,0,0,.35); }
  h1 { font-size:20px; margin:0 0 4px; }
  p  { margin:0 0 20px; color:var(--mut); font-size:13px; }
  label { display:block; font-size:12px; color:var(--mut); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid #334155;
          background:#0f172a; color:var(--txt); font-size:15px; }
  input:focus { outline:2px solid var(--acc); border-color:transparent; }
  button { margin-top:22px; width:100%; padding:12px; border:0; border-radius:8px; cursor:pointer;
           background:var(--acc); color:#082f49; font-weight:600; font-size:15px; }
  button:disabled { opacity:.6; cursor:wait; }
  #erro { min-height:18px; margin-top:14px; color:var(--err); font-size:13px; }
</style>
</head>
<body>
<form id="f">
  <h1>Painel Operações Digital</h1>
  <p>Acesso restrito. Entre com seu usuário.</p>
  <label for="u">Usuário</label>
  <input id="u" autocomplete="username" required autofocus>
  <label for="s">Senha</label>
  <input id="s" type="password" autocomplete="current-password" required>
  <button id="b">Entrar</button>
  <div id="erro" role="alert"></div>
</form>
<script>
const f = document.getElementById("f"), erro = document.getElementById("erro"), b = document.getElementById("b");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  erro.textContent = ""; b.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario: f.u.value, senha: f.s.value }),
    });
    if (r.ok) { location.href = "/"; return; }
    erro.textContent = r.status === 401 ? "Usuário ou senha inválidos." : "Erro ao entrar. Tente de novo.";
  } catch { erro.textContent = "Sem conexão com o servidor."; }
  b.disabled = false;
});
</script>
</body>
</html>
